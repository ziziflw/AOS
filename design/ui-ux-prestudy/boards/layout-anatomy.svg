<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><style>text{font:16px 'Segoe UI','Microsoft YaHei UI',sans-serif;fill:#dfebf6}.sub{font-size:13px;fill:#aec0d3}.label{font-size:24px;font-weight:600}.rect{stroke:#4a5b6d;stroke-width:1;fill:#202832}.zone{fill:#28384b;stroke:#87b7ff}.n{fill:#1d2733;stroke:#68829e}.wire{fill:none;stroke:#87b7ff;stroke-width:2}</style><rect width="1440" height="900" fill="#121820"/><text x="32" y="44" class="label">AOS / 五区布局草图 · CSS像素基线</text><text x="32" y="74" class="sub">界面偏好属于视图；运行状态由原C1负责。此图不是已实现的面板停靠系统。</text><g transform="translate(32 108)"><rect class="rect" width="1376" height="70"/><text x="20" y="29">顶部：文档 / 保存 / 校验 / 环境 / 运行 / 取消</text><text x="20" y="53" class="sub">标题32 + 工具栏48；运行与校验分开；不提供万能暂停</text><rect class="rect" y="70" width="40" height="650"/><rect class="rect" x="40" y="70" width="220" height="650"/><text x="58" y="106">节点库</text><text x="58" y="134" class="sub">220 / 可收起</text><text x="58" y="188">搜索 / 收藏 / 最近</text><text x="58" y="228" class="sub">基础、模型、工具</text><text x="58" y="255" class="sub">Agent、流程控制</text><rect class="zone" x="260" y="70" width="816" height="454"/><text x="284" y="106" class="label">中央工作流画布</text><text x="284" y="134" class="sub">选择 / 连线 / 平移 / 缩放 / 分组；操作焦点不抢表单</text><path class="wire" d="M470 280H542L596 246H676L741 280H816"/><rect class="n" x="300" y="250" width="170" height="90" rx="4"/><rect class="n" x="540" y="210" width="170" height="120" rx="4"/><rect class="n" x="816" y="250" width="170" height="90" rx="4"/><text x="316" y="282">输入 / 上游</text><text x="557" y="244">当前选择</text><text x="833" y="282">受控操作</text><text x="557" y="279" class="sub">端口 / 参数摘要</text><text x="557" y="305" class="sub">状态独立呈现</text><rect class="rect" x="1076" y="70" width="300" height="650"/><text x="1094" y="106">属性检查器</text><text x="1094" y="134" class="sub">300 / 可调宽与换边</text><text x="1094" y="188">参数 / 输入输出 / 运行</text><text x="1094" y="229" class="sub">动态Schema与版本约束</text><text x="1094" y="260" class="sub">审批内容 / 依赖诊断</text><rect class="rect" x="260" y="524" width="816" height="196"/><text x="284" y="560">底部：运行概览 / 问题 / 事件 / 原始记录</text><text x="284" y="589" class="sub">默认196高，可折叠；问题定位回图；技术日志不主导界面</text><text x="284" y="644" class="sub">分隔条可拖动，菜单提供键盘替代；恢复默认布局始终可达</text><rect class="rect" y="720" width="1376" height="24"/><text x="16" y="738" class="sub">状态栏：定义修订 / 图计数 / 实际连接状态</text></g></svg>
